[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repo-to-skill"
version = "0.1.0"
description = "Evidence-driven repository to Agent Skill compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "pydantic>=2.8", "typer>=0.12", "PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML>=6.0.12"]
benchmark = ["matplotlib>=3.9"]
analysis = ["tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-go==0.25.0"]

[project.urls]
Repository = "https://github.com/wzn1118/repo-to-skill"
Issues = "https://github.com/wzn1118/repo-to-skill/issues"

[project.scripts]
r2s = "r2s.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/r2s"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
