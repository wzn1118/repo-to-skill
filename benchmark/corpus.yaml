schema_version: 2
name: Public Repo Benchmark 1.0
description: High-star public repositories selected for evidence-driven static discovery evaluation.
star_policy:
  tier_a_min: 30000
  tier_b_min: 10000
  tier_c_max: 9999
  core_minimum: 30
  tier_a_minimum: 10
  tier_b_minimum: 20
repositories:
  # Tier A: landmark repositories. All are part of the high-star core benchmark.
  - id: yt-dlp
    repository: yt-dlp/yt-dlp
    tier: A
    set: core
    benchmark_area: python-cli
    ground_truth: true
  - id: black
    repository: psf/black
    tier: A
    set: core
    benchmark_area: python-cli
    ground_truth: true
